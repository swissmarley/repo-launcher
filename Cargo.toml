[workspace]
resolver = "3"
members = ["crates/launcher-core", "crates/launcher-cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Swissmarley/repo-launcher"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
