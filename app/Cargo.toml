[package]
name = "repo-launcher"
description = "Install and launch GitHub projects without technical steps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "repo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
launcher-core = { path = "../crates/launcher-core" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio-util = "0.7.20"
