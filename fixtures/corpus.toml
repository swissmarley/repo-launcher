# Real public repos used to test detection and recipes. Each is pinned to a commit; snapshots
# (file listing + manifests + the few source lines detection looks at) live in fixtures/corpus/.
# Refresh snapshots with: cargo run -p rl -- corpus-sync fixtures/corpus.toml fixtures/corpus
#
# Expectations: `kind` + `run` (argv prefix) for runnable projects, or `problem` (a ProblemCode)
# for ones we deliberately explain instead of running.

# --- Python web apps ---------------------------------------------------------------------------
[[repo]]
url = "https://github.com/streamlit/demo-uber-nyc-pickups"
commit = "62fa70f59da265450b97429e9bfae99b85bcacdd"
